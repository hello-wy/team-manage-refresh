services:
  app:
    # 生产环境通过 IMAGE 指定本次部署的不可变 commit 镜像。
    # 本地开发如需源码构建，可执行：docker compose up -d --build
    image: ${IMAGE:-ghcr.io/hello-wy/team-manage-refresh:latest}
    build: .
    container_name: team-manage-app
    ports:
      # APP_PORT 控制宿主机对外端口，镜像内部固定监听 8008
      - "${APP_PORT:-8008}:8008"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/team_manage.db
