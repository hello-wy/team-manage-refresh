{% extends "layouts/document.html" %}
{% block layout_body %}
    {% if user %}
    <div class="main-container">
        <main class="main-content">{% block content %}{% endblock %}</main>
    </div>
    {% else %}
    <div class="auth-container">{% block auth_content %}{% endblock %}</div>
    {% endif %}
    <footer class="footer">
        <p>&copy; 2026 <a href="https://github.com/loLollipop/team-manage-refresh" target="_blank" class="footer-link">GPT Team 管理系统</a> v{{ app_version }}</p>
    </footer>
{% endblock %}
