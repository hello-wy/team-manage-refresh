    <!-- 成员管理 模态框 -->
    <div id="manageMembersModal" class="modal-overlay">
        <div class="modal member-management-modal">
            <div class="modal-header">
                <div>
                    <h3 id="modalTeamName">Team 成员管理</h3>
                    <small id="modalTeamEmail" class="text-muted" style="display: block; margin-top: 4px;"></small>
                </div>
                <div class="member-modal-header-actions">
                    <button type="button" class="btn btn-sm btn-secondary member-balance-refresh" onclick="loadModalMemberList(window.currentTeamId)"
                        title="重新同步成员与席位余额">
                        <i data-lucide="refresh-cw" aria-hidden="true"></i> 刷新
                    </button>
                    <button class="modal-close" onclick="hideModal('manageMembersModal')" aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="modal-body member-modal-body">
                <div class="member-summary-bar">
                    <div id="memberSeatSummary" class="member-seat-summary" role="status" aria-live="polite">正在读取席位数量...</div>
                    <div class="member-auto-kick-settings">
                        <span class="member-auto-kick-title" title="从成员加入 Team 的时间开始计算；可在成员列表中逐个设置是否参与，Team 所有者不会自动下线。">
                            <i data-lucide="clock-3" aria-hidden="true"></i> 自动下线
                        </span>
                        <div class="member-auto-kick-controls">
                            <label for="memberAutoKickHours">加入后</label>
                            <input id="memberAutoKickHours" class="form-control" type="number" value="2"
                                min="1" max="8760" step="1" inputmode="numeric">
                            <span>小时</span>
                            <button id="memberAutoKickSaveBtn" type="button" class="btn btn-sm btn-primary"
                                onclick="saveMemberAutoKickHours()">保存</button>
                        </div>
                    </div>
                </div>
                <div class="member-meta-line">
                    <span id="memberSyncStatus" class="text-muted" role="status" aria-live="polite"></span>
                    <span class="text-muted member-seat-hint">剩余席位已扣除邀请及待确认操作的预留</span>
                    <span id="memberSeatBalanceError" class="text-muted" role="status"></span>
                </div>

                <div class="member-tabs" role="tablist" aria-label="成员视图">
                    <button type="button" role="tab" id="memberTabSeats" class="member-tab is-active" aria-selected="true"
                        aria-controls="memberPanelSeats" onclick="selectMemberTab('seats')">
                        全部席位
                    </button>
                    <button type="button" role="tab" id="memberTabJoined" class="member-tab" aria-selected="false"
                        aria-controls="memberPanelJoined" onclick="selectMemberTab('joined')">
                        已加入 <span id="memberJoinedCount" class="member-tab-count">0</span>
                    </button>
                    <button type="button" role="tab" id="memberTabInvited" class="member-tab" aria-selected="false"
                        aria-controls="memberPanelInvited" onclick="selectMemberTab('invited')">
                        邀请中 <span id="memberInvitedCount" class="member-tab-count">0</span>
                    </button>
                    <button type="button" role="tab" id="memberTabInvite" class="member-tab" aria-selected="false"
                        aria-controls="memberPanelInvite" onclick="selectMemberTab('invite')">
                        <i data-lucide="user-plus" aria-hidden="true"></i> 邀请成员
                    </button>
                </div>

                <section id="memberPanelSeats" class="member-tab-panel" role="tabpanel" aria-labelledby="memberTabSeats">
                    <div id="memberSeatsBoard"><p class="member-seats-message">正在同步完整席位信息...</p></div>
                </section>

                <section id="memberPanelJoined" class="member-tab-panel" role="tabpanel" aria-labelledby="memberTabJoined" hidden>
                    <div class="table-container member-table-scroll">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>邮箱</th>
                                    <th style="width: 100px;">角色</th>
                                    <th style="width: 200px;">席位类型</th>
                                    <th style="width: 160px;">加入时间</th>
                                    <th style="width: 160px;">下线时间</th>
                                    <th style="text-align: right; width: 128px;">授权与操作</th>
                                </tr>
                            </thead>
                            <tbody id="modalJoinedMembersTableBody">
                                <!-- 动态加载内容 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <section id="memberPanelInvited" class="member-tab-panel" role="tabpanel" aria-labelledby="memberTabInvited" hidden>
                    <div class="member-invited-header">
                        <span class="text-muted">已发送邀请、尚未加入的成员</span>
                        <button id="copyInvitedMemberCredentialsBtn" type="button" class="btn btn-sm btn-secondary"
                            onclick="window.invitedMemberCredentials.copy()" title="每行复制账号----密码----2fa（密钥）" disabled>
                            <i data-lucide="copy" aria-hidden="true"></i>
                            <span id="copyInvitedMemberCredentialsLabel">批量复制账号</span>
                        </button>
                    </div>
                    <div class="table-container member-table-scroll">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>邮箱</th>
                                    <th style="width: 100px;">角色</th>
                                    <th style="width: 120px;">席位类型</th>
                                    <th style="width: 160px;">邀请时间</th>
                                    <th style="text-align: right; width: 128px;">授权与操作</th>
                                </tr>
                            </thead>
                            <tbody id="modalInvitedMembersTableBody">
                                <!-- 动态加载内容 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <section id="memberPanelInvite" class="member-tab-panel member-invite-tab" role="tabpanel" aria-labelledby="memberTabInvite" hidden>
                <form id="addMemberForm" class="member-invite-form" onsubmit="handleAddMember(event)">
                    <div class="form-group member-invite-emails">
                        <label for="memberEmails">新增成员邮箱</label>
                        <textarea id="memberEmails" name="memberEmails" class="form-control" rows="4"
                            oninput="updateMemberInviteAvailability()"
                            placeholder="每行一个邮箱，也支持用逗号分隔&#10;user1@example.com&#10;user2@example.com"></textarea>
                        <small class="form-text">每行一个邮箱，或用逗号分隔；自动去重。</small>
                    </div>
                    <div class="form-group member-invite-seat">
                        <label for="inviteSeatType">邀请席位类型</label>
                        <select id="inviteSeatType" name="seatType" class="form-control" onchange="updateMemberInviteAvailability()">
                            <option value="default">标准席位</option>
                            <option value="premium">高级席位</option>
                        </select>
                        <small class="form-text">本批次所有邮箱使用所选类型。</small>
                        <small id="memberInviteQuotaHint" class="form-text" aria-live="polite">正在读取余额...</small>
                    </div>
                    <div class="form-group member-pool-picker">
                        <label for="memberPoolEmail">从账号号池选择</label>
                        <select id="memberPoolEmail" class="form-control" onchange="handleMemberPoolSelection(this)" disabled>
                            <option value="">正在读取可用账号...</option>
                        </select>
                        <small id="memberPoolEmailHint" class="form-text" aria-live="polite">上方显示 7 天内加入过的账号，下方显示 7 天内没有加入过的账号，均可选择。</small>
                    </div>
                    <div class="member-invite-actions">
                        <button type="submit" class="btn btn-primary" id="addMemberSubmitBtn" disabled>
                            <i data-lucide="user-plus"></i> 发送邀请
                        </button>
                    </div>
                </form>
                </section>
            </div>
        </div>
    </div>
