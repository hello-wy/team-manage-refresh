<span class="account-pool-action" data-pool-tooltip="{{ '请先保存所有者的登录密码和 2FA 密钥' if entry.is_owner and not entry.has_login_credentials else '重新登录并导出到 CPA' }}" tabindex="0">
    <button type="button" class="btn btn-sm btn-icon btn-minimal btn-primary account-pool-cpa-button"
        aria-label="重新登录并导出到 CPA" data-entry-id="{{ entry.id }}" data-email="{{ entry.email }}"
        data-workspace-id="{{ '' if entry.workspace_is_personal else (entry.workspace_id or '') }}"
        {% if entry.is_owner and not entry.has_login_credentials %}disabled{% endif %}>
        <img class="cpa-icon" src="/static/cpa-icon.jpg" alt="" aria-hidden="true">
    </button>
</span>
