                            <template id="accountPoolDetails-{{ entry.id }}">
                                <dl class="account-pool-detail-grid">
                                    {% if entry.is_owner %}<div><dt>所有者 Team</dt><dd>{% for team in entry.owner_teams %}{{ team.name }}{% if not loop.last %}、{% endif %}{% endfor %}</dd></div>{% endif %}
                                    <div><dt>当前 2FA 验证码</dt><dd>{% if entry.is_virtual_owner %}未保存{% else %}<totp-code data-email="{{ entry.email }}"></totp-code>{% endif %}</dd></div>
                                    <div><dt>最近加入时间</dt><dd>{{ entry.joined_at|format_datetime }}</dd></div>
                                    <div><dt>验活检查时间</dt><dd data-liveness-checked>{{ entry.liveness_checked_at|format_datetime }}</dd></div>
                                    <div><dt>验活详情</dt><dd data-liveness-message>{{ '正常' if entry.liveness_status == 'alive' else entry.liveness_message or '暂无详情' }}</dd></div>
                                    <div><dt>额度检查时间</dt><dd>{{ team_usage.quota_checked_at|default(none)|format_datetime }}</dd></div>
                                    <div><dt>额度读取结果</dt><dd>{{ usage.get('error') or ('读取成功' if usage.get('status') == 'ok' else '尚未获取额度') }}</dd></div>
                                    <div><dt>轮转状态</dt><dd>{% if rotation.label %}{{ rotation.label }} · {% endif %}{{ rotation.reason or '暂无轮转信息' }}{% if rotation.team_id %} · {{ rotation.team_name }} #{{ rotation.team_id }}{% endif %}</dd></div>
                                    <div><dt>首次高级使用</dt><dd>{{ team_usage.premium_used_at|default(none)|format_datetime }}</dd></div>
                                    <div><dt>席位切换</dt><dd>{{ team_usage.seat_switch_count or 0 }} 次 · 最近 {{ team_usage.seat_switched_at|default(none)|format_datetime }}</dd></div>
                                </dl>
                                <div class="account-pool-detail-workspace"><span>切换 Team</span>
                                    {% if selectable_teams and not entry.is_virtual_owner %}
                                    <select class="form-control account-pool-workspace-selector" data-entry-id="{{ entry.id }}" data-selected-id="{{ entry.workspace_id or '' }}" aria-label="选择 {{ entry.email }} 的 Team" title="选择 {{ entry.email }} 的 Team">
                                        {% for workspace in selectable_teams %}
                                        <option value="{{ workspace.id }}" {% if workspace.id == entry.workspace_id %}selected{% endif %}>{{ workspace.name }}</option>
                                        {% endfor %}
                                    </select>
                                    {% else %}<span class="account-pool-team-name">{{ current_team_label }}</span>{% endif %}
                                </div>
                                <div class="account-pool-detail-actions">
                                {% if entry.is_virtual_owner %}<p class="text-muted">所有者使用 Team Token 验活。可在上方补充登录密码和 2FA 密钥，保存后可重新登录。</p>{% else %}
                                {% if entry.is_owner %}<p class="text-muted">所有者不参与跨 Team 补位，禁止加入其他 Team、删除或更换 2FA。</p>{% endif %}
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary account-pool-json-export-button"
                                    title="重新登录并导出 JSON"
                                    aria-label="重新登录并导出 JSON"
                                    data-entry-id="{{ entry.id }}"
                                    data-email="{{ entry.email }}"
                                    data-workspace-id="{{ '' if entry.workspace_is_personal else (entry.workspace_id or '') }}"
                                >
                                    <i data-lucide="download" aria-hidden="true"></i>
                                导出 JSON</button>
                                <button type="button" class="btn btn-sm btn-secondary account-pool-team-checkout-button"
                                    title="生成 Team 支付链接" aria-label="生成 Team 支付链接"
                                    data-entry-id="{{ entry.id }}" data-email="{{ entry.email }}"
                                    data-workspace-id="{{ '' if entry.workspace_is_personal else (entry.workspace_id or '') }}">
                                    <i data-lucide="credit-card" aria-hidden="true"></i>
                                充值 Team</button>
                                <button type="button" class="btn btn-sm btn-secondary account-pool-rotate-2fa-button" title="更换 2FA 密钥" aria-label="更换 2FA 密钥" data-entry-id="{{ entry.id }}" data-email="{{ entry.email }}" {% if entry.is_owner %}disabled{% endif %}>
                                    <i data-lucide="key-round" aria-hidden="true"></i>
                                更换 2FA</button>
                                <button type="button" class="btn btn-sm btn-danger account-pool-delete-button" title="永久删除账号" aria-label="永久删除账号" onclick='deleteAccountPoolEntry({{ entry.id }}, {{ entry.email|tojson }})' {% if entry.is_owner %}disabled{% endif %}>
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                永久删除账号</button>
                                {% endif %}</div>
                                {% if entry.export_job_error %}<p class="account-pool-detail-error">Sub2API 导出失败：{{ entry.export_job_error }}</p>{% endif %}
                                <h4>加入记录 · {{ entry.history_count }} 次</h4>
                            </template>
