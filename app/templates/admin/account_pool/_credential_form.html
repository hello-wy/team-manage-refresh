<form id="accountPoolCredentialForm" hidden aria-labelledby="accountPoolCredentialTitle">
    <h4 id="accountPoolCredentialTitle">补充 / 修改密码与 2FA</h4>
    <p id="accountPoolCredentialStatus" class="account-pool-hint" role="status" aria-live="polite"></p>
    <fieldset id="accountPoolCredentialFields" disabled style="border: 0; padding: 0; margin: 0; min-width: 0;">
        <div class="form-group">
            <label for="accountPoolCredentialPassword">登录密码</label>
            <input id="accountPoolCredentialPassword" class="form-control" type="text" autocomplete="off" maxlength="4096" placeholder="输入登录密码" aria-describedby="accountPoolCredentialStatus">
        </div>
        <div class="form-group">
            <label for="accountPoolCredentialTwoFactor">2FA 密钥</label>
            <input id="accountPoolCredentialTwoFactor" class="form-control" type="text" autocomplete="off" maxlength="2048" placeholder="输入 Base32 密钥" aria-describedby="accountPoolCredentialStatus" spellcheck="false" autocapitalize="off">
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary" id="accountPoolCredentialSave">
                <i data-lucide="save" aria-hidden="true"></i> 保存密码 / 2FA
            </button>
        </div>
    </fieldset>
</form>
