name: Build & Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Netcup
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      NETCUP_PORT: ${{ secrets.NETCUP_PORT || '22' }}
    steps:
      - name: Configure SSH
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          set -eu
          test -n "$NETCUP_SSH_KEY"
          test -n "$NETCUP_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_KEY" > "$HOME/.ssh/netcup_deploy"
          chmod 600 "$HOME/.ssh/netcup_deploy"
          ssh-keyscan -p "$NETCUP_PORT" "$NETCUP_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Pull and restart service on Netcup
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_DEPLOY_PATH: ${{ secrets.NETCUP_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test -n "$NETCUP_USER"
          test -n "$NETCUP_DEPLOY_PATH"
          ssh -i "$HOME/.ssh/netcup_deploy" -p "$NETCUP_PORT" \
            "$NETCUP_USER@$NETCUP_HOST" \
            "IMAGE='$IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' DEPLOY_PATH='$NETCUP_DEPLOY_PATH' sh -s" <<'REMOTE_SCRIPT'
          set -eu
          cd "$DEPLOY_PATH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          IMAGE="$IMAGE" docker compose pull app
          IMAGE="$IMAGE" docker compose up -d --remove-orphans app
          docker image prune -f
          docker compose ps
          REMOTE_SCRIPT
